name: CI

on:
  pull_request:
  push:
    branches: [main]
    # git tag v1.2.0 && git push origin v1.2.0 publishes image tags 1.2.0 and 1.2. Versions
    # from the changelog are tagged without a git tag, see the image job.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Report and data files must never be committed: they hold private data.
  no-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on tracked report or data files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(reports|rapporten|huizen|data)/|\.report\.md$|\.sqlite(-.*)?$|\.db$|(^|/)huizenjacht-[^/]*\.json$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must not be tracked:"
            echo "$bad"
            exit 1
          fi
          echo "No report or data files tracked."

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no major-version tags (v10) any more, only exact ones.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request is checked out as a merge commit; its first parent is the base branch.
          fetch-depth: 2
      - uses: azure/setup-helm@v5
      # chart-publish skips a version that is published already, so a chart change without a
      # new version would never reach a cluster. Comment-only and blank-line changes are fine.
      - name: Require a new chart version for chart changes
        if: github.event_name == 'pull_request'
        run: |
          chart=deploy/helm/huizenjacht
          changes=$(git diff --unified=0 HEAD^1 HEAD -- "$chart" \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[+-][[:space:]]*(#.*)?$' || true)
          if [ -z "$changes" ]; then
            echo "No chart changes."
            exit 0
          fi
          if ! old=$(git show "HEAD^1:$chart/Chart.yaml" 2>/dev/null | awk '$1 == "version:" {print $2}') || [ -z "$old" ]; then
            echo "New chart, no version to compare."
            exit 0
          fi
          new=$(awk '$1 == "version:" {print $2}' "$chart/Chart.yaml")
          if [ "$new" = "$old" ] || [ "$(printf '%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=$chart/Chart.yaml::The chart changed, so raise version in $chart/Chart.yaml (now $new, $old on the base branch)."
            exit 1
          fi
          echo "Chart version goes from $old to $new."
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - run: helm lint --strict deploy/helm/huizenjacht --set auth.acknowledgeNoLogin=true
      # Render the chart in its main configurations and check it against the Kubernetes schemas.
      - name: Validate rendered manifests
        run: |
          chart=deploy/helm/huizenjacht
          validate() {
            kubeconform -strict -summary -kubernetes-version 1.37.0 -schema-location default
          }
          helm template hj "$chart" --set auth.acknowledgeNoLogin=true | validate
          helm template hj "$chart" --set auth.oidc.enabled=true \
            --set auth.oidc.issuer=https://auth.example.com --set auth.oidc.existingSecret=hj-oidc \
            --set auth.publicUrl=https://huizen.example.com --set auth.oidc.allowedGroups=huizen \
            | validate
          helm template hj "$chart" --set auth.acknowledgeNoLogin=true \
            --set ingress.enabled=true --set ingress.tls.enabled=true \
            --set environment.label=dev \
            | validate
          helm template hj "$chart" --set auth.acknowledgeNoLogin=true \
            --set reports.git.enabled=true --set reports.git.existingSecret=huizenjacht-reports \
            --set reports.git.repo=https://github.com/brnl-claude/huizenjacht_rapporten \
            | validate
          helm template hj "$chart" --set auth.acknowledgeNoLogin=true \
            --set 'android.certFingerprints={AB:CD:EF}' \
            | validate
          helm template hj "$chart" --set auth.acknowledgeNoLogin=true \
            --set persistence.existingClaim=huizenjacht-data \
            --set reports.existingClaim=huizenjacht-reports \
            | validate

  # Pushes to main publish the chart to oci://ghcr.io/<owner>/charts, once per chart version:
  # a version that is published already is left alone, so a chart change needs a new
  # `version` in Chart.yaml.
  chart-publish:
    needs: [chart]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CHART: deploy/helm/huizenjacht
      REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Log in to ghcr.io
        run: >-
          echo "${{ secrets.GITHUB_TOKEN }}" |
          helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push the chart unless this version is published already
        run: |
          name=$(helm show chart "$CHART" | awk '$1 == "name:" {print $2}')
          version=$(helm show chart "$CHART" | awk '$1 == "version:" {print $2}')
          if found=$(helm show chart "$REGISTRY/$name" --version "$version" 2>&1); then
            echo "$name $version is published already. Raise version in $CHART/Chart.yaml to publish a change."
            exit 0
          fi
          echo "$name $version is not published yet: $found"
          helm package "$CHART" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/$name-$version.tgz" "$REGISTRY"

  image:
    needs: [no-reports, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # /api/health reports this, so you can tell which build a `latest` pod runs.
      - name: Pick the version the app reports
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      # Pull requests only build the image; pushes to main also publish it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HJ_VERSION=${{ steps.version.outputs.version }}
            HJ_COMMIT_URL=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The newest version in frontend/src/changelog.ts gets image tags 0.9.0 and 0.9 on the
      # first build of main that has it; later builds never move a version tag.
      - name: Tag the newest changelog version if it has no image yet
        if: github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          version=$(node .github/scripts/changelog-notes.mjs version)
          sha=${GITHUB_SHA::7}
          if docker buildx imagetools inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "$IMAGE:$version exists already."
            exit 0
          fi
          echo "Tagging sha-$sha as $version and ${version%.*}"
          docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:${version%.*}" "$IMAGE:sha-$sha"

  # The Android app (android/): a debug build on pull requests to check it builds; on main a
  # release build signed with the key from the repository secrets (see android/README.md),
  # which the release job attaches to the GitHub release as huizenjacht.apk for Obtainium.
  # Its version is the newest changelog version with `android` changes; the version code
  # follows from it. Only that version's release gets the APK, so there is a new app only
  # when the app itself changed.
  android:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.path != '' }}
      release: ${{ steps.version.outputs.release }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A pull request that changes the app must say what changed in it, under `android` of
      # the newest version in the changelog; otherwise it would get no new APK.
      - name: Android changes are in the changelog
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '\.md$' | grep -q '^android/'; then
            newest=$(node .github/scripts/changelog-notes.mjs version)
            android=$(node .github/scripts/changelog-notes.mjs android-version)
            if [ "$newest" != "$android" ]; then
              echo "::error::This pull request changes android/: list those changes under android of $newest in frontend/src/changelog.ts."
              exit 1
            fi
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Version from the changelog
        id: version
        working-directory: .
        run: |
          android=$(node .github/scripts/changelog-notes.mjs android-version)
          newest=$(node .github/scripts/changelog-notes.mjs version)
          echo "HJ_VERSION=$android" >> "$GITHUB_ENV"
          echo "release=$([ "$android" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Only pushes to main get the release key; a pull request (also from a fork) never does.
      - name: Signing key
        id: key
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the release gets no APK (see android/README.md)."
          fi
      - name: Build
        env:
          ANDROID_KEYSTORE: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            ./gradlew --no-daemon lintRelease assembleRelease
            cp app/build/outputs/apk/release/app-release.apk huizenjacht.apk
          else
            ./gradlew --no-daemon lintDebug assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk huizenjacht.apk
          fi
      # The key's fingerprint goes in the chart value android.certFingerprints, so Chrome
      # shows the app without an address bar.
      - name: Fingerprint
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          fingerprint=$("$apksigner" verify --print-certs huizenjacht.apk \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 \
            | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          {
            echo "### Android-app $HJ_VERSION"
            echo
            if [ -n "${{ steps.key.outputs.path }}" ]; then
              echo "Signed with the release key. SHA-256 fingerprint for \`android.certFingerprints\`: \`$fingerprint\`"
            else
              echo "Debug build with a throwaway key; only main with the release key in the secrets makes the APK for the release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: huizenjacht-apk
          path: android/huizenjacht.apk
          retention-days: 7

  # Creates the GitHub release v<version> for the newest changelog version, once, with the
  # signed Android app as huizenjacht.apk when that version has Android changes. Such a release
  # without the APK (made before the signing key was in the secrets) gets it on the next run:
  # re-run this workflow on main.
  release:
    needs: [image, android]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: needs.android.outputs.signed == 'true' && needs.android.outputs.release == 'true'
        with:
          name: huizenjacht-apk
          path: ${{ runner.temp }}/apk
      # A version without Android changes gets no APK and is marked as a pre-release, so
      # Obtainium (which skips pre-releases) does not count it as a newer release hidden by its
      # filters, and releases/latest stays the newest app.
      - name: Create the release if the newest changelog version has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK: ${{ runner.temp }}/apk/huizenjacht.apk
          ANDROID_RELEASE: ${{ needs.android.outputs.release }}
        run: |
          version=$(node .github/scripts/changelog-notes.mjs version)
          assets=()
          if [ -f "$APK" ]; then
            assets=("$APK")
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version exists already."
            if [ -f "$APK" ] && ! gh release view "v$version" --json assets --jq '.assets[].name' | grep -qx huizenjacht.apk; then
              echo "Adding the Android app to v$version."
              gh release upload "v$version" "$APK"
              gh release edit "v$version" --prerelease=false --latest
            fi
            exit 0
          fi
          node .github/scripts/changelog-notes.mjs notes > "$RUNNER_TEMP/notes.md"
          kind=()
          if [ "$ANDROID_RELEASE" != true ]; then
            kind=(--prerelease)
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" \
            --notes-file "$RUNNER_TEMP/notes.md" "${kind[@]}" "${assets[@]}"
      # Releases from before that rule (0.17.0 and later without an APK) become pre-releases too.
      - name: Mark older releases without the app as pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq '.[] | select(.prerelease == false and .draft == false)
                  | select((.tag_name | ltrimstr("v") | split(".") | map(tonumber)) >= [0, 17, 0])
                  | select([.assets[].name] | index("huizenjacht.apk") | not) | .tag_name' |
          while read -r tag; do
            echo "Marking $tag as a pre-release (no huizenjacht.apk)."
            gh release edit "$tag" --prerelease
          done
