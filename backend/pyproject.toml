[project]
name = "huizenjacht"
version = "0.1.0"
description = "Backend API for Huizenjacht."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "pyjwt[crypto]>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "segno>=1.6.6",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
