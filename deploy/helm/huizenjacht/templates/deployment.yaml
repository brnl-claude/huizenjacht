{{- if and (not .Values.auth.acknowledgeNoLogin) (not .Values.auth.oidc.enabled) }}
{{- fail "Choose a login: set auth.oidc.enabled (with issuer, existingSecret and auth.publicUrl), or auth.acknowledgeNoLogin=true to run without one" }}
{{- end }}
{{- if and .Values.reports.git.enabled .Values.reports.existingClaim }}
{{- fail "Set either reports.git.enabled or reports.existingClaim, not both" }}
{{- end }}
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hj.fullname" . }}
  labels:
    {{- include "hj.labels" . | nindent 4 }}
spec:
  # SQLite on a ReadWriteOnce volume: one pod, and the old one stops before the new starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hj.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hj.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.reports.git.enabled }}
      initContainers:
        # Native sidecar: keeps running next to the app and refreshes /git/current.
        - name: git-sync
          image: "{{ .Values.reports.git.image }}"
          restartPolicy: Always
          env:
            - name: GITSYNC_REPO
              value: {{ required "Set reports.git.repo" .Values.reports.git.repo | quote }}
            - name: GITSYNC_REF
              value: {{ .Values.reports.git.ref | quote }}
            - name: GITSYNC_PERIOD
              value: {{ .Values.reports.git.period | quote }}
            - name: GITSYNC_ROOT
              value: /git
            - name: GITSYNC_LINK
              value: current
            # After each sync git-sync tells the app (same pod, so localhost) to import now.
            - name: GITSYNC_WEBHOOK_URL
              value: http://127.0.0.1:8000/api/import/hook
            - name: GITSYNC_WEBHOOK_SUCCESS_STATUS
              value: "202"
            - name: HOME
              value: /tmp
            {{- with .Values.reports.git.existingSecret }}
            - name: GITSYNC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.reports.git.usernameKey }}
            - name: GITSYNC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.reports.git.passwordKey }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.reports.git.resources | nindent 12 }}
          volumeMounts:
            - name: reports
              mountPath: /git
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: app
          image: {{ $image | quote }}
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HJ_DATA_DIR
              value: /data
            {{- if .Values.auth.oidc.enabled }}
            - name: HJ_AUTH_MODE
              value: oidc
            - name: HJ_OIDC_ISSUER
              value: {{ required "Set auth.oidc.issuer" .Values.auth.oidc.issuer | quote }}
            - name: HJ_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            - name: HJ_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "Set auth.oidc.existingSecret" .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.existingSecretKey }}
            - name: HJ_OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            - name: HJ_PUBLIC_URL
              value: {{ required "Set auth.publicUrl" .Values.auth.publicUrl | quote }}
            - name: HJ_ALLOWED_GROUPS
              value: {{ .Values.auth.oidc.allowedGroups | quote }}
            - name: HJ_ALLOWED_USERS
              value: {{ .Values.auth.oidc.allowedUsers | quote }}
            - name: HJ_ADMIN_GROUPS
              value: {{ .Values.auth.oidc.adminGroups | quote }}
            - name: HJ_SESSION_DAYS
              value: {{ .Values.auth.sessionDays | quote }}
            {{- with .Values.auth.oidc.caPem }}
            - name: HJ_OIDC_CA_PEM
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with include "hj.reportsDir" . }}
            - name: HJ_REPORTS_DIR
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.reports.hook.existingSecret }}
            - name: HJ_IMPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.reports.hook.existingSecretKey }}
            {{- end }}
            {{- with .Values.environment.label }}
            - name: HJ_ENV_LABEL
              value: {{ . | quote }}
            - name: HJ_ENV_COLOR
              value: {{ $.Values.environment.color | quote }}
            {{- end }}
            {{- with .Values.android.certFingerprints }}
            - name: HJ_ANDROID_PACKAGE
              value: {{ $.Values.android.packageName | quote }}
            - name: HJ_ANDROID_CERT_FINGERPRINTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.forwardedAllowIps }}
            - name: FORWARDED_ALLOW_IPS
              value: {{ . | quote }}
            {{- end }}
            - name: HJ_BACKUP_KEEP_DAYS
              value: {{ ternary .Values.backups.keepDays 0 .Values.backups.enabled | quote }}
            - name: HJ_BACKUP_TIME
              value: {{ .Values.backups.time | quote }}
            - name: HJ_BACKUP_TIMEZONE
              value: {{ .Values.backups.timezone | quote }}
            {{- if .Values.backups.persistence.enabled }}
            - name: HJ_BACKUP_DIR
              value: /backups
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            {{- if .Values.backups.persistence.enabled }}
            - name: backups
              mountPath: /backups
            {{- end }}
            {{- if or .Values.reports.git.enabled .Values.reports.existingClaim }}
            - name: reports
              mountPath: /reports
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "hj.dataClaim" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.backups.persistence.enabled }}
        - name: backups
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-backups" (include "hj.fullname" .)) .Values.backups.persistence.existingClaim }}
        {{- end }}
        {{- if .Values.reports.git.enabled }}
        - name: reports
          emptyDir: {}
        {{- else if .Values.reports.existingClaim }}
        - name: reports
          persistentVolumeClaim:
            claimName: {{ .Values.reports.existingClaim }}
            readOnly: true
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
