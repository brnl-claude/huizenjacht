apiVersion: v1
kind: Service
metadata:
  name: {{ include "hj.fullname" . }}
  labels:
    {{- include "hj.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "hj.selectorLabels" . | nindent 4 }}
